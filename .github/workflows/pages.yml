# Publishes this branch to GitHub Pages (Settings > Pages > Source: GitHub Actions).
# GitHub Pages can't send the COOP/COEP headers the game needs for SharedArrayBuffer (site.py's _headers is for
# Cloudflare), so coi-serviceworker adds them in the browser; the first visit reloads once.
name: Pages
on:
  push:
    branches: [pages-lgffb]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Get map.json (kept out of git) from the official site
        run: curl -fsSL https://stunts-recomp.pages.dev/stunts/map.json -o stunts/map.json
      - name: Build the site
        run: python3 stunts/tools/site.py
      - name: Cross-origin isolation for GitHub Pages
        run: |
          curl -fsSL https://unpkg.com/coi-serviceworker@0.1.7/coi-serviceworker.min.js -o dist/stunts/coi-serviceworker.min.js
          python3 - <<'PY'
          p = 'dist/stunts/index.html'
          s = open(p).read()
          i = s.index('<script')
          s = s[:i] + '<script src="coi-serviceworker.min.js"></script>' + s[i:]
          open(p, 'w').write(s)
          PY
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=stunts/"><a href="stunts/">Stunts HD</a>\n' > dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}stunts/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
